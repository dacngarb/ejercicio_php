
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

    <div class="container py-5">

        <h2 class="text-center text-info fw-bold mb-5">
            Ejercicio 17 - División entera
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-7 col-sm-10 col-12">
                <div class="bg-white border rounded-4 p-4 shadow-lg">

                    <h3 class="text-primary fw-bold text-center mb-4">
                        Introduce los datos
                    </h3>

                    <form action="17ProcesoDivision.php" method="GET">

                        <div class="mb-3">
                            <label for="num1" class="form-label">
                                Dividendo
                            </label>
                            <input type="number" class="form-control"
                                   id="num1" name="num1" min="0" step="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="num2" class="form-label">
                                Divisor
                            </label>
                            <input type="number" class="form-control"
                                   id="num2" name="num2" min="1" step="1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                ¿Qué quieres calcular?
                            </label>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       id="cociente" name="opciones[]" value="cociente">
                                <label class="form-check-label" for="cociente">
                                    Cociente
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="checkbox"
                                       id="resto" name="opciones[]" value="resto">
                                <label class="form-check-label" for="resto">
                                    Resto
                                </label>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Calcular
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
