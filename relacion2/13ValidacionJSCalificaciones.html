
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Captación de datos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark">

    <div id="main" class="container py-5">

        <h2 class="text-center text-info fw-bold mb-5">
            Calculadora de notas
        </h2>

        <div class="row justify-content-center">

            <div class="col-md-7 col-sm-10 col-12">

                <form id="formulario"
                      class="bg-white border rounded-4 p-4 shadow-lg"
                      method="GET"
                      action="13ValidacionJSCalificaciones.php"
                      novalidate>

                    <h4 class="text-center text-primary mb-4">
                        Introduce las notas
                    </h4>

                    <!-- Nota inicial -->
                    <div class="mb-4">
                        <label for="nInicial" class="form-label fw-bold">
                            Nota inicial (20%)
                        </label>

                        <input type="text"
                               class="form-control form-control-lg"
                               id="nInicial"
                               name="nInicial"
                               placeholder="Introduce la nota inicial">

                        <div id="errorInicial" class="text-danger"></div>
                    </div>

                    <!-- Primera nota -->
                    <div class="mb-4">
                        <label for="n1" class="form-label fw-bold">
                            Primera nota (10%)
                        </label>

                        <input type="text"
                               class="form-control form-control-lg"
                               id="n1"
                               name="n1"
                               placeholder="Introduce la primera nota">

                        <div id="error1" class="text-danger"></div>
                    </div>

                    <!-- Segunda nota -->
                    <div class="mb-4">
                        <label for="n2" class="form-label fw-bold">
                            Segunda nota (30%)
                        </label>

                        <input type="text"
                               class="form-control form-control-lg"
                               id="n2"
                               name="n2"
                               placeholder="Introduce la segunda nota">

                        <div id="error2" class="text-danger"></div>
                    </div>

                    <!-- Tercera nota -->
                    <div class="mb-4">
                        <label for="n3" class="form-label fw-bold">
                            Tercera nota (40%)
                        </label>

                        <input type="text"
                               class="form-control form-control-lg"
                               id="n3"
                               name="n3"
                               placeholder="Introduce la tercera nota">

                        <div id="error3" class="text-danger"></div>
                    </div>

                    <!-- Mensaje -->
                    <div id="mensaje"></div>

                    <!-- Botón -->
                    <div class="d-grid gap-2">

                        <button type="submit"
                                class="btn btn-success btn-lg fw-bold">
                            Calcular resultado
                        </button>

                        <button type="reset"
                                class="btn btn-secondary btn-lg fw-bold">
                            Limpiar formulario
                        </button>

                    </div>

                </form>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

        // Seleccionamos el formulario
        const formulario = document.getElementById("formulario");

        // Creamos un array con los campos
        const campos = [
            { id: "nInicial", error: "errorInicial" },
            { id: "n1", error: "error1" },
            { id: "n2", error: "error2" },
            { id: "n3", error: "error3" }
        ];

        // Función para comprobar las notas
        function validarCampo(campo) {

            const input = document.getElementById(campo.id);
            const error = document.getElementById(campo.error);

            const valor = input.value.trim();

            let mensajeError = "";

            if (valor === "") {

                mensajeError = "El campo es obligatorio.";

            } else {

                const numero = Number(valor);

                if (!Number.isFinite(numero)) {

                    mensajeError = "Introduce un número válido.";

                } else if (numero < 0 || numero > 10) {

                    mensajeError = "La nota debe estar entre 0 y 10.";

                }
            }

            error.textContent = mensajeError;

            // Cambiamos los estilos según la validación
            if (mensajeError !== "") {

                input.classList.add("is-invalid");
                input.classList.remove("is-valid");

                return false;

            } else {

                input.classList.remove("is-invalid");
                input.classList.add("is-valid");

                return true;

            }
        }

        

        // Evento SUBMIT
        formulario.addEventListener("submit", function(evento) {

            let formularioValido = true;

            campos.forEach(function(campo) {

                if (!validarCampo(campo)) {

                    formularioValido = false;

                }

            });

            if (!formularioValido) {

                evento.preventDefault();

                const mensaje = document.getElementById("mensaje");

                mensaje.textContent =
                    "Corrige los errores antes de continuar.";

                mensaje.className = "alert alert-danger";

            }

        });

        

        

        // Evento CLICK para limpiar los errores
        formulario.addEventListener("reset", function() {

            campos.forEach(function(campo) {

                document.getElementById(campo.id)
                    .classList.remove("is-valid", "is-invalid");

                document.getElementById(campo.error)
                    .textContent = "";

            });

            document.getElementById("mensaje").textContent = "";

        });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
