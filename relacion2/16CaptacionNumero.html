
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 16</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark">

    <div class="container py-5">

        <h2 class="text-center text-info fw-bold mb-5">
            Ejercicio 16 - Números primos y divisores
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-7 col-sm-10 col-12">
                <div class="bg-white border rounded-4 p-4 shadow-lg">

                    <h3 class="text-primary fw-bold text-center mb-4">
                        Introduce los datos
                    </h3>

                    <form action="16ProcesoNumero.php" method="GET">

                        <div class="mb-3">
                            <label for="num" class="form-label">
                                Introduce un número entero positivo
                            </label>

                            <input type="number" class="form-control"
                                   id="num" name="num" min="1" step="1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                ¿Qué quieres hacer?
                            </label>

                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="opcion" id="primo" value="primo" required>
                                <label class="form-check-label" for="primo">
                                    Comprobar si es primo
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio"
                                       name="opcion" id="divisores" value="divisores">
                                <label class="form-check-label" for="divisores">
                                    Mostrar sus divisores
                                </label>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Calcular
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
