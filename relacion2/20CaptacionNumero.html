
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 20</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

    <div class="container py-5">

        <h2 class="text-center text-info fw-bold mb-5">
            Ejercicio 20 - Conversión a binario, octal o hexadecimal
        </h2>

        <div class="row justify-content-center">
            <div class="col-md-7 col-sm-10 col-12">
                <div class="bg-white border rounded-4 p-4 shadow-lg">

                    <h3 class="text-primary fw-bold text-center mb-4">
                        Introduce un número
                    </h3>

                    <form action="20ProcesoBOH.php" method="GET">

                        <div class="mb-3">
                            <label for="num" class="form-label">
                                Número decimal
                            </label>

                            <input type="number" class="form-control"
                                   id="num" name="num" min="0" step="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="opcion" class="form-label">
                                Tipo de conversión
                            </label>

                            <select class="form-select" id="opcion" name="opcion" required>
                                <option value="0" selected>Selecciona operación</option>
                                <option value="2">Binario</option>
                                <option value="8">Octal</option>
                                <option value="16">Hexadecimal</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">
                                Convertir
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
