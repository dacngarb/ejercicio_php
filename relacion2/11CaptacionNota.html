<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark">

    <div id="main" class="container py-5">

        <h2 class="text-center text-info fw-bold mb-5">
            Calculadora matemática
        </h2>

        <div class="row justify-content-center">

            <div class="col-md-7 col-sm-10 col-12">

                <form class="bg-white border rounded-4 p-4 shadow-lg"
                      method="GET"
                      action="11CalculoFaltas.php">

                    <h4 class="text-center text-primary mb-4">
                        Introduce las notas
                    </h4>

                    <!-- nota 1 -->
                    <div class="mb-4">
                        <label for="n1" class="form-label fw-bold">
                            Primera nota
                        </label>

                        <input type="number"
                               step="any"
                               class="form-control form-control-lg"
                               id="n1"
                               name="n1"
                               placeholder="Introduce la primera nota"
                               required>
                    </div>

                    <!-- nota 2 -->
                    <div class="mb-4">
                        <label for="n2" class="form-label fw-bold">
                            Segunda nota
                        </label>

                        <input type="number"
                               class="form-control form-control-lg"
                               id="n2"
                               name="n2"
                               placeholder="Introduce la Segunda nota"
                               required>
                    </div>

                    <h4 class="text-center text-primary mb-4">
                        Introduce las faltas
                    </h4>

                    <!-- faltas -->
                    <div class="mb-4">
                        <label for="n2" class="form-label fw-bold">
                            Número de faltas
                        </label>

                        <input type="number"
                               class="form-control form-control-lg"
                               id="faltas"
                               name="faltas"
                               placeholder="Introduce las faltas"
                               required>
                    </div>


                    <!-- Botón -->
                    <div class="d-grid">
                        <button type="submit"
                                class="btn btn-success btn-lg fw-bold">
                            Calcular resultado
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
